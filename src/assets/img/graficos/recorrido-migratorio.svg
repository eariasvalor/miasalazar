<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="system-ui, sans-serif">
  <!-- Trayecto conceptual, no un mapa real: el color pasa de terracota (cálido,
       origen) a slate (frío, destino) — el mismo principio que rige toda la
       paleta del sitio: el calor se deja atrás, el frío es donde se llega. -->
  <defs>
    <linearGradient id="ruta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8543a" />
      <stop offset="33%" stop-color="#a4675d" />
      <stop offset="66%" stop-color="#907b7f" />
      <stop offset="100%" stop-color="#7c8ea2" />
    </linearGradient>
  </defs>

  <path
    d="M90,150 C170,150 230,90 310,90 C390,90 450,130 530,130 C610,130 650,70 730,70"
    fill="none"
    stroke="url(#ruta)"
    stroke-width="1.5"
    stroke-dasharray="1 9"
    stroke-linecap="round"
  />

  <!-- México -->
  <circle cx="90" cy="150" r="7" fill="none" stroke="#b8543a" stroke-width="1.5" />
  <circle cx="90" cy="150" r="3" fill="#b8543a" />
  <text x="90" y="184" fill="#ede6dd" font-size="15" text-anchor="middle" letter-spacing="1">MÉXICO</text>

  <!-- España -->
  <circle cx="310" cy="90" r="7" fill="none" stroke="#a4675d" stroke-width="1.5" />
  <circle cx="310" cy="90" r="3" fill="#a4675d" />
  <text x="310" y="60" fill="#ede6dd" font-size="15" text-anchor="middle" letter-spacing="1">ESPAÑA</text>

  <!-- Suecia -->
  <circle cx="530" cy="130" r="7" fill="none" stroke="#907b7f" stroke-width="1.5" />
  <circle cx="530" cy="130" r="3" fill="#907b7f" />
  <text x="530" y="164" fill="#ede6dd" font-size="15" text-anchor="middle" letter-spacing="1">SUECIA</text>

  <!-- Alemania -->
  <circle cx="730" cy="70" r="7" fill="none" stroke="#7c8ea2" stroke-width="1.5" />
  <circle cx="730" cy="70" r="3" fill="#7c8ea2" />
  <text x="730" y="40" fill="#ede6dd" font-size="15" text-anchor="middle" letter-spacing="1">ALEMANIA</text>
</svg>
