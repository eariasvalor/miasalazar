<article class="proximo">
  <picture>
    <source
      type="image/avif"
      srcset="
        {{ cancion().portadaUrl }}-320.avif 320w,
        {{ cancion().portadaUrl }}-483.avif 483w
      "
      sizes="18rem"
    />
    <source
      type="image/webp"
      srcset="
        {{ cancion().portadaUrl }}-320.webp 320w,
        {{ cancion().portadaUrl }}-483.webp 483w
      "
      sizes="18rem"
    />
    <img
      [src]="cancion().portadaUrl + '-483.webp'"
      width="483"
      height="462"
      loading="lazy"
      alt=""
    />
  </picture>

  <p class="proximo__fecha">{{ fechaFormateada() }}</p>

  @if (cancion().preSaveUrl) {
    <a class="proximo__presave" [href]="cancion().preSaveUrl" target="_blank" rel="noopener">
      Pre-save
    </a>
  }

  <dl class="proximo__cuenta" aria-label="Tiempo restante para el lanzamiento">
    <div>
      <dt>D</dt>
      <dd>{{ dosDigitos(restante().dias) }}</dd>
    </div>
    <div>
      <dt>H</dt>
      <dd>{{ dosDigitos(restante().horas) }}</dd>
    </div>
    <div>
      <dt>M</dt>
      <dd>{{ dosDigitos(restante().minutos) }}</dd>
    </div>
    <div>
      <dt>S</dt>
      <dd>{{ dosDigitos(restante().segundos) }}</dd>
    </div>
  </dl>
</article>
