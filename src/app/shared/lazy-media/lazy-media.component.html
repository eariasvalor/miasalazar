@if (mostrarEmbed()) {
  <iframe
    class="lazy-media__embed"
    [src]="embedUrl()"
    width="100%"
    height="352"
    frameborder="0"
    loading="lazy"
    [title]="cancion().titulo + ' — Spotify'"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
  ></iframe>
} @else {
  <button
    type="button"
    class="lazy-media__placeholder"
    (click)="cargar()"
    [attr.aria-label]="etiquetaReproducir() + ': ' + cancion().titulo"
  >
    <picture>
      <source
        type="image/avif"
        [srcset]="
          cancion().portadaUrl + '-320.avif 320w, ' + cancion().portadaUrl + '-640.avif 640w'
        "
        sizes="18rem"
      />
      <source
        type="image/webp"
        [srcset]="
          cancion().portadaUrl + '-320.webp 320w, ' + cancion().portadaUrl + '-640.webp 640w'
        "
        sizes="18rem"
      />
      <img
        [src]="cancion().portadaUrl + '-640.webp'"
        width="640"
        height="640"
        loading="lazy"
        alt=""
      />
    </picture>
    <span class="lazy-media__play" aria-hidden="true">▶</span>
  </button>
}
