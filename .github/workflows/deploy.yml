name: Deploy a GitHub Pages

on:
  push:
    # TODO: quitar 'claude/arquitectura-prompt-7ii17r' cuando volvamos a
    # trabajar con PRs a main en vez de desplegar directo desde esta rama.
    branches: [main, claude/arquitectura-prompt-7ii17r]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- --watch=false
      - run: npm run build -- --base-href=/miasalazar/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/mia-salazar-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
